<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Angel &amp; Devil</title>
  <meta name="description" content="An angel and a devil read your note and banter about it. 天使と悪魔があなたのノートを読んで掛け合いをします。">
  <link rel="alternate" hreflang="ja" href="ja/">
  <link rel="alternate" hreflang="en" href="en/">
  <link rel="alternate" hreflang="x-default" href="en/">
  <script>
    // Send visitors to the page in their browser's language: Japanese → ja/, anything else → en/.
    (function () {
      var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
      var ja = String(langs[0] || "").toLowerCase().indexOf("ja") === 0;
      location.replace((ja ? "ja/" : "en/") + location.hash);
    })();
  </script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="wrap">
    <h1>Angel &amp; Devil</h1>
    <p><a href="ja/" hreflang="ja">日本語</a> · <a href="en/" hreflang="en">English</a></p>
  </main>
</body>
</html>
